services:
  postgres:
    image: postgres:16
    container_name: nocode-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: nocode
      POSTGRES_USER: nocode
      POSTGRES_PASSWORD: nocode123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
